name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build extension
        run: npm run build

      - name: Package extension zip
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            pii-guard-for-email-*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      # To auto-publish to the Chrome Web Store instead of (or in addition
      # to) a GitHub Release, add CHROME_EXTENSION_ID, CHROME_CLIENT_ID,
      # CHROME_CLIENT_SECRET and CHROME_REFRESH_TOKEN as repo secrets and
      # add a step here that calls the Chrome Web Store publish API with
      # the packaged zip. Left out for now since no store listing exists yet.
